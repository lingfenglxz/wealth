name: Update SSQ and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ssq-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify source readers and publication policy
        run: |
          python scripts/test_sources.py
          python scripts/test_policy.py
          python scripts/test_data.py
      - name: Fetch and independently confirm draws
        id: update
        run: python scripts/update_data.py
      - name: Verify and settle public research archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/test_archive.py
          python scripts/update_archive.py
      - uses: actions/setup-node@v4
        if: github.event_name != 'schedule' || steps.update.outputs.changed == 'true' || steps.update.outputs.status_changed == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and unit tests
        if: github.event_name != 'schedule' || steps.update.outputs.changed == 'true' || steps.update.outputs.status_changed == 'true'
        run: |
          npm ci
          npm test
          python scripts/test_data.py
          npm run build
      - name: Browser verification
        if: github.event_name != 'schedule' || steps.update.outputs.changed == 'true' || steps.update.outputs.status_changed == 'true'
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Commit public draws and source status
        if: steps.update.outputs.changed == 'true' || steps.update.outputs.status_changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/ssq.json public/data/source-status.json
          git commit -m 'Update verified SSQ draws and source health'
          git push
      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || steps.update.outputs.changed == 'true' || steps.update.outputs.status_changed == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'schedule' || steps.update.outputs.changed == 'true' || steps.update.outputs.status_changed == 'true'
        with:
          path: web/dist
      - uses: actions/deploy-pages@v4
        if: github.event_name != 'schedule' || steps.update.outputs.changed == 'true' || steps.update.outputs.status_changed == 'true'
        id: deploy
